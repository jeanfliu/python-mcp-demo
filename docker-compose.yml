services:
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - LANGUAGE=zh_TW:zh

  ollama-init:
    image: ollama/ollama:latest
    container_name: mcp-ollama-init
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  python-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-mcp-demo
    environment:
      OLLAMA_HOST: http://ollama:11434

      MCP_SERVER_URL: https://demo01.i3x.net/mcp
      
      PYTHONUNBUFFERED: "1"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: "no"

  mcp-inspector:
    build:
      context: .
      dockerfile: Dockerfile.inspector
    # container_name: mcp-inspector
    ports:
      - "127.0.0.1:6274:6274"
    # environment:
      # HOST: 0.0.0.0
      # CLIENT_PORT: 6274
      # DANGEROUSLY_BIND_ALL_INTERFACES: "true"
      # MCP_AUTO_OPEN_ENABLED: "false"

      # # GitHub Codespaces origin
      # ALLOWED_ORIGINS: "https://humble-telegram-697q9gj57gwh56q7-6274.app.github.dev,http://localhost:6274"
      # MCP_INSPECTOR_ALLOWED_HOSTS: "humble-telegram-697q9gj57gwh56q7-6274.app.github.dev"
    volumes:
      - .:/app:ro
    restart: unless-stopped
    
volumes:
  ollama_data:
