services:
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - LANGUAGE=zh_TW:zh

  ollama-init:
    image: ollama/ollama:latest
    container_name: mcp-ollama-init
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  python-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-mcp-demo
    environment:
      OLLAMA_HOST: http://ollama:11434

      MCP_SERVER_URL: https://demo01.i3x.net/mcp
      
      PYTHONUNBUFFERED: "1"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: "no"
    
volumes:
  ollama_data:
